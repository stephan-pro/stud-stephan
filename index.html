<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the whole screen of a phone with a notch; the bottom bar keeps clear of
         it with env(safe-area-inset-bottom) (see app.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Colour of the browser bar: the page background (--bg), the same as in the manifest. -->
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="description" content="Stud Stephan – meine Klemmbaustein-Sammlung als Vitrine" />
    <!-- Installable app (P15): manifest and icons from public/ (`npm run icons`). Vite puts the
         base path /stud-stephan/ in front of these addresses. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Stud Stephan" />
    <title>Stud Stephan</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
