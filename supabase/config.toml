# The local Supabase instance of `npm run check:db` (CI only, in Docker). The real project
# (`ohuqwiypmoqyuxsgouxw`, see docs/SUPABASE.md) is set up in its dashboard; tables, rules and
# buckets come from `supabase/migrations/` there too (`npx supabase db push`).
project_id = "stud-stephan"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Above the largest bucket (Studio files, 25 MB); the buckets set their own limits.
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "https://stephan-pro.github.io/stud-stephan/"
additional_redirect_urls = ["http://localhost:5173/stud-stephan/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No new accounts (P4b), as in the real project ("Allow new users to sign up" off): Stephan's
# account is made by hand, the tests make theirs as admin. The app asks with `shouldCreateUser:
# false` anyway.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

# The tests send many codes in a short time; the real project keeps Supabase's limits.
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
# Despite the name this switches sign-in by e-mail on at all; new accounts are off above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# A new code after 1 s instead of 60 s, so the tests stay short (the app waits a minute anyway).
max_frequency = "1s"
# Six digits, ten minutes: as in the real project and the app (`src/auth/auth.ts`).
otp_length = 6
otp_expiry = 600

# The mail with the code (no link); the same text goes into the real project's dashboard.
[auth.email.template.magic_link]
subject = "Dein Anmeldecode für Stud Stephan"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Dein Anmeldecode für Stud Stephan"
content_path = "./supabase/templates/code.html"
