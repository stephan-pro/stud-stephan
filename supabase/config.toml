# The local Supabase instance of `npm run check:db` (CI only, in Docker). The real project
# (`ohuqwiypmoqyuxsgouxw`, see docs/SUPABASE.md) is set up in its dashboard; tables, rules and
# buckets come from `supabase/migrations/` there too (`npx supabase db push`).
project_id = "stud-stephan"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Above the largest bucket (Studio files, 25 MB); the buckets set their own limits.
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "https://stephan-pro.github.io/stud-stephan/"
additional_redirect_urls = ["http://localhost:5173/stud-stephan/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Sign-in by code and closed sign-ups come with P4b; the tests make their accounts as admin.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
