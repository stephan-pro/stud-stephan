<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon, draft A of the PO (P15): a rounded square in the token accent (#FFC93C) with white
       diagonal stripes (as on the collection card, 45 %), a frame in the token ink (#14213D) and
       2 x 2 round studs in accent with a strong ink border and a small white gloss arc top left.
       No trademark, no figure. `npm run icons` renders the PNG sizes from this file
       (scripts/make-icons.mjs). XML comments must not contain two hyphens in a row. -->
  <title>Stud Stephan</title>
  <defs>
    <pattern id="stripes" width="120" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(31)">
      <rect x="51" y="-1" width="18" height="18" fill="#FFFFFF" />
    </pattern>
    <g id="stud">
      <circle r="56" fill="#FFC93C" stroke="#14213D" stroke-width="18" />
      <path d="M-32.8 -8.8A34 34 0 0 1 -8.8 -32.8" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
    </g>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#FFC93C" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#stripes)" opacity="0.45" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#14213D" stroke-width="20" />
  <use href="#stud" x="182" y="182" />
  <use href="#stud" x="330" y="182" />
  <use href="#stud" x="182" y="330" />
  <use href="#stud" x="330" y="330" />
</svg>
